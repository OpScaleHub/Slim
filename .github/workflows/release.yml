name: Publish Release

# Builds a signed release APK on every push to main that touches app code,
# and publishes it to GitHub Releases (tagged by versionName, marked latest).
# The website's "Download APK" button points to:
#   https://github.com/PlayFoundryHQ/Slim/releases/latest/download/slim-launcher.apk

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'release'
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Decode Signing Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Read Version Name
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building release for version $VERSION"

      - name: Prepare Release Assets
        run: |
          cp app/build/outputs/apk/release/app-release.apk "slim-launcher-v${{ steps.version.outputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "slim-launcher.apk"

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG exists - updating APK assets"
            gh release upload "$TAG" \
              "slim-launcher-v$VERSION.apk" "slim-launcher.apk" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "Creating new release $TAG"
            gh release create "$TAG" \
              "slim-launcher-v$VERSION.apk" "slim-launcher.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Slim Launcher v$VERSION" \
              --generate-notes \
              --latest
          fi
